# ============ CORE ============
baseURL = "https://tidjani.eu/"
title = "Tidjani Saleh"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false

# ============ LANGUAGES ============
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false   # en stays at /, others at /ar/ and /mey/

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

# ============ THEME PARAMS (shared) ============
[params]
  env = "production"
  author = "Tidjani Saleh"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowShareButtons = false
  hideFooter = false
  displayFullLangName = true

# ============ SOCIAL ICONS (shared) ============
[[params.socialIcons]]
  name = "email"
  url = "mailto:tidjani@posteo.eu"
[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/tidjanisaleh/"
[[params.socialIcons]]
  name = "bluesky"
  url = "https://bsky.app/profile/tidjani.eu"
[[params.socialIcons]]
  name = "github"
  url = "https://github.com/sahrawismus"
[[params.socialIcons]]
  name = "rss"
  url = "/index.xml"

# ============ ENGLISH ============
[languages.en]
  label = "English"
  locale = "en-GB"
  direction = "ltr"
  weight = 1
  title = "Tidjani Saleh"
  [languages.en.params]
    description = "Personal website of Tidjani Saleh"
    DateFormat = "2 January 2006"
    [languages.en.params.profileMode]
      enabled = true
      title = "Tidjani Saleh"
      subtitle = "Welcome!"
      [[languages.en.params.profileMode.buttons]]
        name = "Articles"
        url = "/articles/"
      [[languages.en.params.profileMode.buttons]]
        name = "Blog"
        url = "/blog/"
  [[languages.en.menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 10
  [[languages.en.menus.main]]
    name = "Articles"
    pageRef = "/articles"
    weight = 20
  [[languages.en.menus.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 30


